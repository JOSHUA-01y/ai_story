server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 本地产物（图片 / 视频 / agent artifacts）由 nginx 直接伺服，不再转发给 Django。
    #
    # 为什么不用 proxy_pass: Django 的 FileResponse 不实现 HTTP Range，实测
    # `Range: bytes=0-1023` 会返回 200 + 整个文件（Content-Range 为空），
    # 导致大视频要整个下完才能播、进度条拖不动。nginx 伺服静态文件原生支持
    # Range（返回 206 + Content-Range），且不占用 gunicorn/gevent worker。
    #
    # 依赖: 宿主机 ./storage 已挂载到 /usr/share/nginx/storage
    #       （见 docker-compose.override.yml 的 frontend.volumes），否则这里会 404。
    location /storage/ {
        alias /usr/share/nginx/storage/;
    }

    # 真实模型的产物落盘后，后端返回的是 /api/v1/content/storage/{image,video}/xxx
    # 形状的路径（见 core/ai_client/image2video_client.py:_build_storage_url 与
    # core/ai_client/image_result_utils.py:_build_storage_url）。
    # 若让它走上面的 location /api/ 转发，就又会落到 Django 的 FileResponse
    # （不支持 Range），真实视频依旧拖不动进度条。所以这里同样改为 nginx 直接伺服。
    #
    # 例外：不带文件路径的 /api/v1/content/storage/image/ 是「图片列表」JSON 接口
    # （apps/content/urls.py -> StorageImageListView），必须留给后端。
    location = /api/v1/content/storage/image/ {
        proxy_pass http://backend:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ^~ 前缀匹配优先于 location /api/，因此这些文件请求不会被转发给 Django
    location ^~ /api/v1/content/storage/ {
        alias /usr/share/nginx/storage/;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
